<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Calculator</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .container {
            text-align: center;
            color: white;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #62d6ff, #4aa8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #ccc;
        }
        a {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(145deg, #62d6ff, #4aa8ff);
            color: #0a0e1a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1em;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 24px rgba(65, 177, 255, 0.3);
        }
        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(65, 177, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Power Calculator</h1>
        <p>Fast • Simple • Beautiful</p>
        <a href="power_calculator.html">Open Calculator →</a>
    </div>
</body>
</html>
